<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Inter;src:url(fonts/inter-cyrillic.woff2) format("woff2");font-weight:100 900;unicode-range:U+0400-04FF}@font-face{font-family:Inter;src:url(fonts/inter-latin.woff2) format("woff2");font-weight:100 900}
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1350px;overflow:hidden;font-family:Inter,-apple-system,sans-serif;color:#fff;

.hd{position:absolute;top:64px;left:72px;right:72px;display:flex;align-items:center;gap:20px;font-weight:800;font-size:38px;letter-spacing:.5px}
.hd img{width:76px;height:76px;border-radius:20px}
.badge{margin-left:auto;padding:12px 26px;border-radius:40px;font-weight:900;font-size:34px;color:#2a1a02;background:linear-gradient(135deg,#f6dc8e,#e8b84a 45%,#c08a2c);box-shadow:0 8px 30px rgba(232,184,74,.45)}
h1{position:absolute;top:196px;left:72px;right:72px;font-size:66px;line-height:1.1;font-weight:900;letter-spacing:-1.5px}
h1 em{font-style:normal;background:linear-gradient(135deg,#f6dc8e,#e8b84a 50%,#c08a2c);-webkit-background-clip:text;color:transparent}
.sub{position:absolute;top:370px;left:72px;right:72px;font-size:34px;line-height:1.35;color:rgba(255,255,255,.78);font-weight:500}
.ph{position:absolute;width:390px;height:540px;border-radius:38px;padding:10px;background:linear-gradient(160deg,#f6dc8e,#c08a2c);box-shadow:0 30px 70px rgba(0,0,0,.55)}
.ph img{width:100%;height:100%;object-fit:cover;object-position:top;border-radius:30px;display:block}
.ph b{position:absolute;left:50%;bottom:-26px;transform:translateX(-50%);white-space:nowrap;padding:10px 22px;border-radius:30px;background:#0f1c2e;border:2px solid #e8b84a;font-size:26px;font-weight:800}
.p1{left:30px;top:540px;transform:rotate(-7deg)}.p3{right:30px;top:540px;transform:rotate(7deg)}.p2{left:345px;top:505px;z-index:2}
.chips{position:absolute;left:72px;right:72px;bottom:60px;display:flex;flex-wrap:wrap;gap:14px;justify-content:center}
.chips span{padding:14px 24px;border-radius:40px;background:rgba(255,255,255,.1);border:1.5px solid rgba(246,220,142,.5);font-size:28px;font-weight:700}
</style></head><body>
<div class="hd"><img src="logo192.png">ПУЛЬС РЫНКА<span class="badge">👑 PRO</span></div>

<div class="ph p1"><img src="pro_asset.jpg"><b>Разбор актива</b></div>
<div class="ph p2"><img src="pro_chain.jpg"><b>Схема влияния</b></div>
<div class="ph p3"><img src="pro_events.jpg"><b>События 2 недель</b></div>
<div class="chips"><span>📊 Разбор недели</span><span>📘 PDF-обучение</span><span>📣 Анонсы первыми</span><span>🔒 Закрытый канал</span></div>
</body></html>
