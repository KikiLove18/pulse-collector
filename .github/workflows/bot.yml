name: news-bot

on:
  # Расписание — на сервере Cloudflare: он запускает этот workflow каждые 30 мин (04:00–21:30 UTC).
  # Встроенный cron GitHub срабатывал слишком редко.
  workflow_dispatch:          # кнопка «Run workflow» для ручного запуска
    inputs:
      mode:
        description: "auto / digest / events / results / breaking / preview / morning:<пояс>"
        default: "auto"

permissions:
  contents: write             # чтобы сохранять state/state.json

concurrency: news-bot

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20       # 15.10 выжимка зависла на 56 мин и держала очередь; ИИ сам ограничен 15 мин (AI_RUN_BUDGET)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m bot.main ${{ github.event.inputs.mode || 'auto' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          INGEST_URL: https://market-pulse-app.pult-bot.workers.dev/api/ingest
          INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
          DIGEST_TIMES: ${{ vars.DIGEST_TIMES || '07:30,19:30' }}
      - name: Сохранить состояние
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add state/
          git diff --cached --quiet || (git commit -m "state" && (git push || (git pull --rebase && git push)))
