 const qz=`<div class="frame"></div><div class="abs sk">ТЕСТ · ПРОВЕРЬТЕ СЕБЯ</div><h1 class="abs gh" style="top:180px;font-size:64px">${d.quiz.length>1?d.quiz.length+' вопроса':'Вопрос из гайда'}</h1><div class="abs qz ${d.quiz.length==1?'one':''}" style="top:290px">${d.quiz.map((q,i)=>`<div><b>${d.quiz.length>1?(i+1)+'. ':''}${q[0]}</b>${q[1].map((o,j)=>`<span><em>${'АБВ'[j]}</em>${o}</span>`).join('')}</div>`).join('')}</div><div class="abs ex" style="top:1000px"><i>ОТВЕТЫ</i>на следующем слайде — сначала ответьте сами</div>${cn(n-1)}`;
 const fin=`<div class="frame"></div><div class="abs sk">ОТВЕТЫ И ЧТО ВАЖНО</div><h1 class="abs gh2">${d.ans.length>1?"Ответы":"Ответ"}</h1><div class="abs ans ${d.ans.length==1?'one':''}">${d.ans.map(a=>`<div><b>${a[0]}</b><span>${a[1]}</span></div>`).join('')}</div>
 <div class="abs nxg"><i>${d.nxg[0]}</i><b>${d.nxg[1]}</b><span>${d.nxg[2]}</span></div>${cn(n)}`;
 return [cov,...tk,qz,fin]},
thuc:d=>{const n=d.cols?6:5,cn=i=>`<div class="abs cnt">${i} / ${n}${i<n?' →':''}</div>`;
 const cov=`<div class="abs k">${d.k}</div><h1 class="abs">${d.title}</h1>
 <div class="abs ppl">${d.people.map(p=>`<div><div class="p"><img src="${p[0]}"></div><div><b>${p[1]}</b><span>${p[2]}</span></div></div>`).join('')}</div>
 <div class="abs lead">${d.lead}</div><div class="abs swipe">Листайте →</div>${cn(1)}`;
 const col=(c,t,a,i)=>`<div class="abs k">Нарратив недели · ${i} из 2</div><div class="abs sh ${c}"><span class="ar"></span>${t}</div><div class="abs its">${a.map(x=>`<div><b>${x[0]}</b><span>${x[1]}</span><small>${x[2]}</small></div>`).join('')}</div>`;
 const you=`<div class="abs k">Что это значит для вас</div><div class="abs sh" style="font-size:56px">Для ваших денег</div><div class="abs tl4">${d.you.map(y=>`<div><h4>${y[0]}</h4><u class="${y[1]}">${y[2]}</u><p>${y[3]}</p></div>`).join('')}</div>${cn(4)}`;
 const fin=`<div class="abs k">Что важно</div><div class="abs out">${d.out}</div><div class="abs wt">${d.wt.map(w=>`<div><b>${w[0]}</b><span>${w[1]}</span></div>`).join('')}</div>${cn(5)}`;
 /* 2710: 6 слайдов — cols [{k,c,t,its}]×3, you с заголовком youK/youT */
 if(d.cols){const cc=(c,i)=>`<div class="abs k">${c.k}</div><div class="abs sh ${c.c||''}">${c.c?'<span class="ar"></span>':''}${c.t}</div><div class="abs its">${c.its.map(x=>`<div><b>${x[0]}</b><span>${x[1]}</span><small>${x[2]}</small></div>`).join('')}</div>${cn(i)}`;
  const you2=you.replace('Что это значит для вас',d.youK||'Что это значит для вас').replace('Для ваших денег',d.youT||'Для ваших денег').replace(cn(4),cn(4));
  return [cov.replace(cn(1),cn(1)),cc(d.cols[0],2),cc(d.cols[1],3),you2,cc(d.cols[2],5),fin.replace(cn(5),cn(6))]}
 return [cov,col('up','Тянет вверх',d.up,1)+cn(2),col('dn','Держит',d.down,2)+cn(3),you,fin]},
evt:d=>`<div class="duo"><div class="im" style="background-image:url(${d.img})"></div><div class="d1"></div><div class="d2"></div></div>
 <div class="abs big">${d.big}</div><div class="abs k">${d.k}</div><h1 class="abs fit">${d.title}</h1><div class="abs lead fit">${d.lead}</div>`
};
const ORDER=['monc','evc','tuec','thuc'],CLS={tuec:'tue tuec'};
document.write(ORDER.filter(id=>!window.ONLY||window.ONLY==id).map(id=>{const d=DATA[id],r=C[id](d);return (Array.isArray(r)?r:[r]).map((h,i)=>`<div class="cd ${CLS[id]||id}" id="${id}${Array.isArray(r)?i+1:''}">${BD(d.tag)}${h}${SRC(d.src)}${FT(d.ph)}</div>`).join('')}).join(''));

/* автоподгонка: текст любой длины влезает (уменьшаем кегль, лишние события — «ещё N в приложении») */
function fitAll(){
 document.querySelectorAll('.fit').forEach(el=>{
  if(el.classList.contains('list')){let hidden=0;const evs=[...el.querySelectorAll('.ev')];
   while(el.scrollHeight>el.clientHeight&&evs.length>1){evs.pop().remove();hidden++;}
   if(hidden){const m=document.createElement('div');m.className='more';m.textContent=`+ ещё ${hidden} — в календаре приложения`;el.appendChild(m);while(el.scrollHeight>el.clientHeight&&evs.length>1){evs.pop().remove();hidden++;m.textContent=`+ ещё ${hidden} — в календаре приложения`;}}
  } else if(el.classList.contains('clist')){ /* обложка «События дня»: убираем подстроки, потом последние события → «+ ещё N — листайте» */
   const ov=()=>el.scrollHeight>el.clientHeight+2;if(ov())el.querySelectorAll('.tx small').forEach(x=>x.remove());
   const its=[...el.querySelectorAll('.ci')];let h=0;while(ov()&&its.length>2){its.pop().remove();h++}
   if(h){const m=document.createElement('div');m.className='more';m.style.cssText='font:700 24px Onest;color:#8FA3BF;padding:6px 4px';m.textContent=`+ ещё ${h} — листайте →`;el.appendChild(m);while(ov()&&its.length>2){its.pop().remove();h++;m.textContent=`+ ещё ${h} — листайте →`}}
  } else {let fs=parseFloat(getComputedStyle(el).fontSize);while(el.scrollHeight>el.clientHeight+2&&fs>20){fs-=2;el.style.fontSize=fs+'px';}
   /* не влезло и на 20 px — обрезаем по словам с «…» (последний текстовый узел), чтобы ничего не вылезло */
   const tn=()=>{const w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.nodeValue.trim()&&!n.parentElement.closest('.lab,.lab2')?1:2});let l=null;while(w.nextNode())l=w.currentNode;return l};
   let guard=400;while(el.scrollHeight>el.clientHeight+2&&guard--){const n=tn();if(!n)break;const t=n.nodeValue.replace(/…$/,'').trim(),i=t.lastIndexOf(' ');if(i<=0){n.remove();continue}n.nodeValue=t.slice(0,i).replace(/[,.;:—–-]+$/,'')+'…';el.dataset.cut=1}}
 });
}
/* проверка: элемент вылезает за слайд — пишем в window.OVERFLOW (рендер покажет и вернёт ошибку) */
function checkOverflow(){const bad=[];document.querySelectorAll('.cd').forEach(c=>{const r=c.getBoundingClientRect();c.querySelectorAll('*').forEach(e=>{const q=e.getBoundingClientRect();if(q.width&&(q.right>r.right+1||q.bottom>r.bottom+1||q.left<r.left-1))bad.push(c.id+' .'+String(e.className).split(' ')[0])})});
 const cut=[...document.querySelectorAll('[data-cut]')].map(e=>e.closest('.cd').id+' '+(String(e.className).replace(/\b(abs|fit)\b/g,'').trim()||e.tagName.toLowerCase()));window.CUT=cut;return [...new Set(bad)]}
document.fonts.ready.then(()=>{fitAll();window.OVERFLOW=checkOverflow();window.FIT_DONE=1});
</script>
